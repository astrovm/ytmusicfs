version: 2
updates:
  # Keeps the SHA-pinned actions (and their version comments) on the latest release.
  - package-ecosystem: github-actions
    assignees: [astrovm]
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Bumps the exact pins in pyproject.toml, runtime and dev tools alike.
  - package-ecosystem: pip
    assignees: [astrovm]
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
