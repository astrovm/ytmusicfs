[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusicfs"
version = "0.1.0"
description = "YouTube Music FUSE Filesystem"
readme = "README.md"
authors = [{ name = "astrovm" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: System :: Filesystems",
]
keywords = ["youtube", "music", "fuse", "filesystem", "streaming", "audio"]
requires-python = ">=3.10"
dependencies = [
  "cachetools==7.1.3",
  "fusepy==3.0.1",
  "requests==2.34.2",
  "yt-dlp==2026.3.17",
  "yt-dlp-ejs==0.8.0",
  "ytmusicapi==1.12.0",
]

[project.urls]
"Homepage" = "https://github.com/astrovm/ytmusicfs"
"Bug Tracker" = "https://github.com/astrovm/ytmusicfs/issues"

[project.scripts]
ytmusicfs = "ytmusicfs.cli:main"

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "pytest",
  "pytest-cov",
  "black==26.5.1",
  "ruff==0.15.13",
  "mypy==2.1.0",
]

[tool.setuptools]
packages = ["ytmusicfs"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "A",
  "ARG",
  "ANN201",
  "ANN202",
  "ANN204",
  "C901",
  "C4",
  "DTZ",
  "ISC",
  "ICN",
  "INP",
  "LOG",
  "PIE",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "Q",
  "RET",
  "RUF",
  "SIM",
  "TID",
  "TCH",
  "UP",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "ARG005", "B904"]
"ytmusicfs/filesystem.py" = ["ARG002"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["fuse", "yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
